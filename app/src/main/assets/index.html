<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komik Indo</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mut:#8b90a3;--ac:#ff5b7f;--ac2:#7c5cff;--r:14px}
:root.light{--bg:#f4f5fa;--card:#fff;--tx:#1b1d29;--mut:#6b7080}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #8883}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
#q{flex:1;min-width:140px;padding:9px 14px;border-radius:99px;border:1px solid #8885;background:var(--card);color:var(--tx);outline:0}
button{cursor:pointer;border:0;border-radius:99px;padding:8px 14px;background:var(--card);color:var(--tx);font:inherit}
button:hover{outline:1px solid var(--ac)}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.tabs button.on,.chips button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.chips button{font-size:12px;padding:5px 11px}
#hero{margin:12px 14px;height:210px;border-radius:20px;position:relative;overflow:hidden;background:var(--card);display:none}
#hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:blur(2px) brightness(.45);transform:scale(1.1);transition:.6s}
#hero .in{position:relative;height:100%;display:flex;gap:16px;align-items:flex-end;padding:16px;color:#fff;cursor:pointer}
#hero img{height:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover}
#hero h2{font-size:22px;text-shadow:0 2px 8px #000}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:14px}
.c{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s}
.c:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 24px #0006}
.c .im{aspect-ratio:3/4;background:#8883 center/cover;position:relative}
.c .t{padding:8px 10px;font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c .s{padding:0 10px 9px;color:var(--mut);font-size:12px}
.bd{position:absolute;left:6px;top:6px;background:var(--ac);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.fv{position:absolute;right:6px;top:4px;font-size:20px;background:none;padding:0;text-shadow:0 1px 4px #000;color:#fff}
.sk{aspect-ratio:3/4.6;border-radius:var(--r);background:linear-gradient(90deg,#8882,#8884,#8882);background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200%}}
#more{display:block;margin:6px auto 30px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:10px 28px}
#msg{padding:30px 16px;text-align:center;color:var(--mut)}
#msg code{display:block;margin-top:8px;font-size:12px;word-break:break-all}
dialog{border:0;border-radius:20px;background:var(--bg);color:var(--tx);width:min(720px,96vw);max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
.dh{display:flex;gap:14px;padding:16px}
.dh img{width:130px;border-radius:12px;align-self:flex-start}
.kv{font-size:12px;color:var(--mut);margin-top:4px}.kv b{color:var(--tx)}
.rd img{display:block;width:100%;max-width:720px;margin:0 auto}
.x{position:sticky;top:0;float:right;margin:8px;z-index:3;background:var(--ac);color:#fff}
.set label{display:block;margin:10px 16px 2px;color:var(--mut);font-size:12px}
.set input{margin:0 16px;width:calc(100% - 32px);padding:9px;border-radius:10px;border:1px solid #8885;background:var(--card);color:var(--tx)}
pre{padding:12px 16px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--mut)}
.gn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.gn span{background:#8883;border-radius:99px;padding:3px 10px;font-size:11px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:0 16px 16px}
.chs button{border-radius:10px;font-size:12px;padding:9px 4px;background:var(--card);border:1px solid #8883}
.sy{padding:0 16px 12px;color:var(--mut);font-size:13px}
.cb{display:flex;gap:8px;padding:0 16px 10px;align-items:center}
.cb input{flex:1;min-width:0;padding:8px 12px;border-radius:99px;border:1px solid #8885;background:var(--card);color:var(--tx);outline:0}
.chs{max-height:48vh;overflow:auto}
.nv{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 56px 8px 12px;background:var(--bg);border-bottom:1px solid #8883}
.nv.bt{position:static;padding-right:12px;margin-top:10px}
.gn span[data-l]{cursor:pointer;background:linear-gradient(90deg,#ff5b7f33,#7c5cff33)}
button[disabled]{opacity:.35;pointer-events:none}
.rd img{min-height:120px;background:#8882}
@media(max-width:700px){dialog{width:100vw;max-width:100vw;max-height:100dvh;border-radius:0}.dh img{width:100px}.dh h2{font-size:18px}}
body:has(dialog[open]){overflow:hidden}
dialog.reading{background:#0b0b0d;color:#eee;height:100dvh;max-height:100dvh;width:min(820px,100vw);border-radius:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog.reading .rd{background:#0b0b0d}
dialog.reading .rd img{width:100%;max-width:none;margin:0;min-height:60vh}
dialog.reading .sy{color:#aaa}
dialog.reading{touch-action:pan-x pan-y;overflow:auto}
.rd{will-change:transform}
.nv{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;transition:transform .25s;background:#0b0b0df2;color:#eee;backdrop-filter:blur(8px)}
.nv.h{transform:translateY(-100%)}
.nv button{padding:8px 11px;background:#ffffff1a;color:#fff}
.nv b{font-size:13px;white-space:nowrap}
.nv.bt{position:static;transform:none;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));margin:0}
.pb{position:absolute;left:0;right:0;bottom:0;height:3px}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.nv{left:0}
.nv.bt{position:sticky;top:auto;left:0}
dialog.reading .rd img{display:block}
.chs button.done{opacity:.55;background:transparent;border:1px dashed #8886}
.chs button.last{opacity:1;outline:2px solid var(--ac)}
#hclr{background:#ff5b7f33;margin-top:4px}
#resume{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:10px 18px}
.nw{position:absolute;left:6px;bottom:6px;background:#22c55e;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.dv{padding:22px 12px;text-align:center;font-weight:700;background:linear-gradient(90deg,#ff5b7f33,#7c5cff33);color:#fff}
.imgfail{display:block;width:100%;padding:28px 10px;background:#ffffff12;color:#fff;border-radius:0;border:1px dashed #fff4}
#fchk{background:#22c55e33}
html,body{overscroll-behavior:none}
dialog{overscroll-behavior:contain}
</style>
</head>
<body>
<header>
  <span class="logo">Komik Indo</span>
  <input id="q" placeholder="Cari komik… (Enter)">
  <button id="hs">🕘 Riwayat</button>
  <button id="fav">❤ Favorit</button>
  <button id="th">🌓</button>
  <button id="cfg">⚙</button>
</header>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>
<div id="hero"></div>
<div id="msg"></div>
<div id="grid"></div>
<button id="more" hidden>Muat lebih banyak</button>

<dialog id="dlg"></dialog>
<dialog id="set" class="set">
  <button class="x" onclick="set.close()">✕</button>
  <h3 style="padding:16px">Pengaturan</h3>
  <label>Base URL JSON (hasil decode getJSONURLHOME)</label>
  <input id="base">
  <label>CORS proxy (opsional, mis. https://corsproxy.io/?url= ) — dipakai jika browser memblokir</label>
  <input id="proxy">
  <p style="padding:14px 16px"><button id="save">Simpan & muat ulang</button></p>
</dialog>

<script>
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let BASE=ls.get('base','https://kmkindo.click/?'),PROXY=ls.get('proxy','');
let favs=ls.get('favs',[]),state={mode:'page=latest&paged=',paged:true,page:1,items:[],tab:'Terbaru',favView:false};

const TABS=[['Terbaru','page=latest&paged='],['Daftar','page=list&paged='],['Manga','page=type&type=Manga&paged='],['Manhwa','page=type&type=Manhwa&paged='],['Manhua','page=type&type=Manhua&paged='],['Hitam Putih','page=colorized&colorized=0&paged='],['Berwarna','page=colorized&colorized=1&paged=']];
const GENRES=['Action','Adventure','Comedy','Drama','Fantasy','Romance','Isekai','School Life','Slice of Life','Horror','Martial Arts','Mystery','Sci-Fi','Supernatural'];

// --- adapter: struktur JSON belum diketahui pasti, jadi dibuat fleksibel ---
const g=(o,ks)=>{for(const k of ks){let v=o?.[k];if(v&&typeof v==='object')v=v.rendered||v.name||v.title||'';if(v!=null&&v!=='')return String(v)}return''};
function pickList(j){
  if(Array.isArray(j))return j;
  for(const k of['data','results','posts','items','list','comics','result']){const v=j?.[k];if(Array.isArray(v))return v;if(v&&typeof v==='object'){const r=pickList(v);if(r.length)return r}}
  for(const v of Object.values(j||{}))if(Array.isArray(v))return v;
  return[];
}
const norm=o=>({raw:o,id:g(o,['id','ID','slug','url','link'])||g(o,['title','judul']),
  title:g(o,['title','judul','name','post_title'])||'(tanpa judul)',
  img:g(o,['image','thumbnail','thumb','cover','img','poster','featured_image','gambar','image_url']),
  sub:g(o,['chapter','latest_chapter','last_chapter','new_chapter','chapter_title']),
  type:g(o,['type','tipe']),rating:g(o,['rating','score'])});

async function api(path){
  const full=/^https?:/.test(path)?path:BASE+path;
  const url=PROXY?PROXY+encodeURIComponent(full):full;
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  try{return JSON.parse(t)}catch{try{return JSON.parse(atob(t.trim()))}catch{throw new Error('Respons bukan JSON: '+t.slice(0,120))}}
}

function msg(h){$('#msg').innerHTML=h||''}
function skeleton(n=12){$('#grid').innerHTML=Array(n).fill('<div class="sk"></div>').join('')}

const saveFavs=()=>ls.set('favs',favs.map(({raw,id,title,img,sub,type,rating,seen,latest})=>({raw,id,title,img,sub,type,rating,seen,latest})));
const isNew=f=>(parseFloat(f.latest)||0)>(parseFloat(f.seen??f.sub)||0);
const maxCh=a=>a.reduce((m,x)=>{const v=parseFloat(x.n);return isNaN(v)?m:Math.max(m,v)},0);
function getChs(j){
  const r=Array.isArray(j)?(j[0]||{}):(j.data&&!Array.isArray(j.data)?j.data:j);
  const L=Array.isArray(r.data)&&r.data.some(x=>x&&x.chapter!=null)?r.data:(findArr(j,a=>a.every(x=>x&&typeof x==='object'&&x.chapter!=null&&(x.url||x.id)))||[]);
  return L.map(x=>({n:g(x,['chapter','title','name'])}));
}
function updateFavLatest(list){
  let ch=false;
  list.forEach(c=>{const f=favs.find(x=>x.id===c.id);
    if(f&&c.sub&&parseFloat(c.sub)>(parseFloat(f.latest)||parseFloat(f.sub)||0)){if(f.seen==null)f.seen=f.sub;f.latest=c.sub;ch=true}});
  if(ch)saveFavs();
}
function markSeen(c){
  const f=favs.find(x=>x.id===c.id);if(!f||!c.chs?.length)return;
  const top=maxCh(c.chs);if(top){f.seen=String(top);f.latest=String(Math.max(parseFloat(f.latest)||0,top));saveFavs()}
}
async function checkUpdates(){
  if(window._chk)return;window._chk=1;
  const q=favs.filter(f=>f.raw?.url),total=q.length;let n=0,done=0;
  const note=()=>msg(`<button id="fchk">🔄 Cek chapter baru</button><div style="margin-top:8px">Memeriksa ${done}/${total}…</div>`);
  note();
  const w=async()=>{while(q.length){const f=q.shift();
    try{const j=await api(f.raw.url);cache[f.raw.url]=j;const top=maxCh(getChs(j));
      if(top>(parseFloat(f.latest)||parseFloat(f.sub)||0)){if(f.seen==null)f.seen=f.sub;f.latest=String(top);n++}}catch(e){}
    done++;note()}};
  await Promise.all([w(),w(),w()]);
  window._chk=0;saveFavs();if(state.favView)showFavs(n+' komik punya chapter baru.');
}
let rq=0,loading=false;
async function load(reset=true){
  if(state.favView)return showFavs();
  if(reset){state.page=1;state.items=[];skeleton();msg('')}
  $('#more').hidden=true;
  const my=++rq;loading=true;
  try{
    const j=await api(state.mode+(state.paged?state.page:''));
    if(my!==rq)return;
    const list=pickList(j).map(norm);
    state.items=state.items.concat(list);
    updateFavLatest(list);
    if(!state.items.length)msg('Tidak ada data. Cek struktur JSON di ⚙ / konsol.');
    render();
    $('#more').hidden=!(state.paged&&list.length);
    if(state.tab==='Terbaru'&&state.page===1)hero();
  }catch(e){
    if(my!==rq)return;
    if(reset)$('#grid').innerHTML='';
    msg(`Gagal memuat: ${esc(e.message)}<br>Kemungkinan diblokir CORS. Buka ⚙ lalu isi CORS proxy, atau jalankan lewat server lokal.<code>${esc(BASE+state.mode)}</code>`);
  }finally{if(my===rq)loading=false}
}
function render(){
  $('#grid').innerHTML=state.items.map((c,i)=>{const f=favs.find(x=>x.id===c.id);
    return `<div class="c" data-i="${i}"><div class="im" style="background-image:url('${bgu(c.img)}')">${c.type?`<span class="bd">${esc(c.type)}</span>`:''}${f&&isNew(f)?'<span class="nw">BARU</span>':''}<button class="fv" data-f="${i}">${f?'❤':'♡'}</button></div><div class="t">${esc(c.title)}</div><div class="s">${c.sub?'Ch. '+esc(c.sub):''}${c.rating?' · ★ '+esc(c.rating):''}</div></div>`}).join('');
}
function hero(){
  const h=$('#hero'),L=state.items.filter(x=>x.img).slice(0,5);
  if(!L.length){h.style.display='none';return}
  h.style.display='block';let n=0;
  const show=()=>{const c=L[n%L.length];
    h.innerHTML=`<div class="bg" style="background-image:url('${bgu(c.img)}')"></div><div class="in"><img src="${esc(c.img)}"><div><small>🔥 Sorotan</small><h2>${esc(c.title)}</h2><small>${c.sub?'Ch. '+esc(c.sub):''}</small></div></div>`;
    h.querySelector('.in').onclick=()=>detail(c);n++};
  show();clearInterval(window._hi);window._hi=setInterval(show,4500);
}
const findArr=(j,t)=>{if(Array.isArray(j)){if(j.length&&t(j))return j;for(const x of j){const r=findArr(x,t);if(r)return r}}else if(j&&typeof j==='object'){for(const v of Object.values(j)){const r=findArr(v,t);if(r)return r}}return null};
const isImg=s=>typeof s==='string'&&/\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(s);
const imgOf=x=>typeof x==='string'?x:g(x,['src','url','img','image']);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bgu=u=>esc(String(u||'').replace(/['"()\\\s<>]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0')));
let cur=null;
const head=c=>`<button class="x" onclick="dlg.close()">✕</button><div class="dh"><img referrerpolicy="no-referrer" src="${esc(c.img)}"><div><h2>${esc(c.title)}</h2><div class="kv"><b>${esc(c.type)}</b>${c.rating?' · ★ '+esc(c.rating):''}${c.sub?' · Ch. '+esc(c.sub):''}</div><div class="gn">${(Array.isArray(c.raw.genre)?c.raw.genre:[]).map(x=>`<span>${esc(typeof x==='object'?g(x,['name','title']):x)}</span>`).join('')}</div></div></div>`;
let hist=ls.get('hist',{});
const hk=c=>c.raw?.url||c.id;
const isRead=(c,u)=>!!hist[hk(c)]?.chs?.[u];
function saveHist(c,ch,read){
  const k=hk(c),e=hist[k]||{chs:{}};
  e.c={id:c.id,title:c.title,img:c.img,sub:c.sub,type:c.type,rating:c.rating,raw:c.raw};
  if(read)e.chs[ch.u]=1;e.last={n:ch.n,u:ch.u};e.t=Date.now();hist[k]=e;
  Object.keys(hist).sort((a,b)=>hist[b].t-hist[a].t).slice(100).forEach(x=>delete hist[x]);
  ls.set('hist',hist);
}
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'baru saja':m<60?Math.floor(m)+' mnt lalu':m<1440?Math.floor(m/60)+' jam lalu':Math.floor(m/1440)+' hari lalu'};
function showHist(){
  state.favView=false;state.hist=true;$('#hero').style.display='none';$('#more').hidden=true;
  const L=Object.entries(hist).sort((a,b)=>b[1].t-a[1].t);
  msg(L.length?'<button id="hclr">Hapus semua riwayat</button>':'Belum ada riwayat baca.');
  $('#grid').innerHTML=L.map(([k,e])=>`<div class="c" data-h="${esc(k)}"><div class="im" style="background-image:url('${bgu(e.c.img)}')"><span class="bd">Ch. ${esc(e.last.n)}</span><button class="fv" data-hd="${esc(k)}">✕</button></div><div class="t">${esc(e.c.title)}</div><div class="s">${Object.keys(e.chs).length} chapter dibaca · ${ago(e.t)}</div></div>`).join('');
}
const cache={},S={asc:false,f:''};
const names=a=>(Array.isArray(a)?a:[]).map(x=>typeof x==='object'?{n:g(x,['name','title']),l:g(x,['link','url'])}:{n:String(x),l:''}).filter(x=>x.n);
const chips=a=>names(a).map(x=>`<span${x.l?` data-l="${esc(x.l)}"`:''}>${esc(x.n)}</span>`).join('');
function headFull(c,r){
  const au=names(r.author).map(x=>x.n).join(', '),cv=r.cover||r.img||c.img;
  return `<button class="x" onclick="dlg.close()">✕</button><div class="dh"><img referrerpolicy="no-referrer" src="${esc(cv)}"><div><h2>${esc(r.title||c.title)}</h2>
  <div class="kv"><b>${esc(r.type||c.type)}</b> · ★ ${esc(r.score||c.rating)}${r.status?' · '+esc(r.status):''}${r.released?' · '+esc(r.released):''}</div>
  ${au?`<div class="kv">✍ ${esc(au)}</div>`:''}<div class="gn">${chips(r.genre)}${chips(r.theme)}${chips(r.demographic)}${chips(r.content)}</div></div></div>`;
}
const chLabel=n=>/^[\d.]+$/.test(n)?'Ch. '+n:n;
function renderCL(){
  const L=cur.chs.map((x,i)=>({...x,i})).filter(x=>x.n.toLowerCase().includes(S.f));
  if(S.asc)L.reverse();
  const lu=hist[hk(cur)]?.last?.u;
  $('#cl').innerHTML=L.map(x=>{const rd=isRead(cur,x.u);return `<button data-i="${x.i}" class="${rd?'done':''}${lu===x.u?' last':''}">${rd?'✓ ':''}${esc(chLabel(x.n))}</button>`}).join('')||'<p class="sy">Tidak ada chapter.</p>';
}
async function detail(c){
  cur=c;zoom=1;const d=$('#dlg');d.classList.remove('reading');rs.tok=0;if(!d.open)d.showModal();persistView();
  if(!c.raw.url){d.innerHTML=head(c);return}
  d.innerHTML=head(c)+'<p class="sy">Memuat detail…</p>';
  try{
    const u=c.raw.url,j=cache[u]||(cache[u]=await api(u));
    const r=Array.isArray(j)?(j[0]||{}):(j.data&&!Array.isArray(j.data)?j.data:j);
    const L=Array.isArray(r.data)&&r.data.some(x=>x&&x.chapter!=null)?r.data:
      (findArr(j,a=>a.every(x=>x&&typeof x==='object'&&x.chapter!=null&&(x.url||x.id)))||[]);
    const seen=new Set();
    c.chs=L.filter(x=>{const k=g(x,['url','link','id']);if(seen.has(k))return false;seen.add(k);return true}).map(x=>{
      let u=g(x,['url','link','id']);if(!/^https?:/.test(u))u=BASE+'page=chapter&id='+u;
      return{n:g(x,['chapter','title','name']),u,d:g(x,['download'])}});
    S.f='';S.asc=false;
    markSeen(c);const lu0=hist[hk(c)]?.last,ri=lu0?c.chs.findIndex(x=>x.u===lu0.u):-1;
    const syn=g(r,['synopsis','sinopsis','description','desc','summary']);
    d.innerHTML=headFull(c,r)+(syn?`<p class="sy">${esc(syn)}</p>`:'')+
      (ri>=0?`<div class="cb"><button id="resume" data-i="${ri}">▶ Lanjut ${esc(chLabel(c.chs[ri].n))}</button></div>`:'')+`<div class="cb"><b>${c.chs.length} Chapter</b><input id="cf" placeholder="Cari nomor…"><button id="cs">↕ Urutan</button></div><div class="chs" id="cl"></div>`;
    renderCL();
  }catch(e){d.innerHTML=head(c)+`<p class="sy">Gagal memuat detail: ${esc(e.message)}</p>`}
}
function persistView(){
  const d=$('#dlg'),o=d.open&&cur?(d.classList.contains('reading')?'read':'detail'):null;
  ls.set('view',{m:state.mode,p:state.paged,t:state.tab,f:state.favView,h:!!state.hist,o,
    c:o?{id:cur.id,title:cur.title,img:cur.img,sub:cur.sub,type:cur.type,rating:cur.rating,raw:cur.raw}:null,ci:cur?.ci});
}
let zoom=1,pz=null;
const ZMIN=1,ZMAX=4,clampZ=z=>Math.min(ZMAX,Math.max(ZMIN,z));
(()=>{
  const d=$('#dlg'),reading=()=>d.open&&d.classList.contains('reading')&&$('#rd');
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  d.addEventListener('touchstart',e=>{
    if(e.touches.length!==2||!reading())return;
    const rd=$('#rd'),t=e.touches,cx=(t[0].clientX+t[1].clientX)/2,cy=(t[0].clientY+t[1].clientY)/2,rr=rd.getBoundingClientRect();
    pz={d0:dist(t)||1,z0:zoom,k:1,ox:cx-rr.left,oy:cy-rr.top,cx,cy};
    rd.style.transformOrigin=pz.ox+'px '+pz.oy+'px';
  },{passive:true});
  d.addEventListener('touchmove',e=>{
    if(!pz||e.touches.length!==2)return;
    e.preventDefault();
    pz.k=clampZ(pz.z0*dist(e.touches)/pz.d0)/pz.z0;
    $('#rd').style.transform='scale('+pz.k+')';
  },{passive:false});
  const end=e=>{
    if(!pz||e.touches.length>=2)return;
    const rd=$('#rd'),p=pz;pz=null;if(!rd)return;
    rd.style.transform='';rd.style.transformOrigin='';
    zoom=clampZ(p.z0*p.k);
    rd.style.width=(zoom*100)+'%';
    const rr=rd.getBoundingClientRect();
    d.scrollLeft+=rr.left+p.ox*p.k-p.cx;
    d.scrollTop+=rr.top+p.oy*p.k-p.cy;
    fitImgs();
  };
  d.addEventListener('touchend',end);
  d.addEventListener('touchcancel',end);
})();
const pos=ls.get('pos',{}),pre=new Set();
let rs={last:0,busy:false,tok:0},lt=0,tk=0,pt;
const bust=u=>u+(u.includes('?')?'&':'?')+'_r='+Date.now();
function imgErr(el){
  const n=+(el.dataset.r||0);
  if(n<2){el.dataset.r=n+1;setTimeout(()=>{el.src=bust(el.dataset.s)},1200*(n+1));return}
  el.style.display='none';
  const b=document.createElement('button');b.className='imgfail';b.textContent='⚠ Gambar gagal dimuat — ketuk untuk muat ulang';
  b.onclick=()=>{b.remove();el.dataset.r=0;el.style.display='';el.src=bust(el.dataset.s)};
  el.after(b);
}
function fitImgs(){
  const L=[...$('#dlg').querySelectorAll('.rd img')].filter(i=>i.naturalWidth);
  if(!L.length)return;
  const cnt={};let best=0,ref=0;
  L.forEach(i=>{const k=Math.round(i.naturalWidth/20)*20;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>best){best=cnt[k];ref=k}});
  L.forEach(i=>{const r=i.naturalWidth/ref;i.style.width=(r>1.08?r*100:100)+'%';i.style.minHeight='0'});
}
async function getImgs(ch){
  const j=cache[ch.u]||(cache[ch.u]=await api(ch.u));
  const im=findArr(j,a=>a.every(x=>isImg(imgOf(x))));
  return{j,urls:im?im.map(imgOf):null};
}
const navH=top=>`<div class="nv${top?'':' bt'}"><button id="bk">☰</button><button class="pv" data-i="0">‹ Prev</button><b class="tt"></b><button class="nx" data-i="0">Next ›</button><button onclick="dlg.close()">✕</button>${top?'<div class="pb"><i id="pbi"></i></div>':''}</div>`;
const secHtml=(i,urls,first)=>`<div class="sec" data-ci="${i}">${first?'':`<div class="dv">${esc(chLabel(cur.chs[i].n))}</div>`}${urls.map(u=>`<img loading="lazy" decoding="async" referrerpolicy="no-referrer" data-s="${esc(u)}" onload="fitImgs()" onerror="imgErr(this)" src="${esc(u)}">`).join('')}</div>`;
function setNav(ci){
  const c=cur,ch=c.chs[ci];if(!ch)return;
  $('#dlg').querySelectorAll('.nv').forEach(n=>{
    const pv=n.querySelector('.pv'),nx=n.querySelector('.nx');
    pv.dataset.i=ci+1;pv.disabled=!c.chs[ci+1];nx.dataset.i=ci-1;nx.disabled=!c.chs[ci-1];
    n.querySelector('.tt').textContent=chLabel(ch.n);
  });
}
function savePos(){
  const d=$('#dlg');if(!d.open||!d.classList.contains('reading')||!cur?.chs)return;
  const dr=d.getBoundingClientRect(),top=dr.top+60,secs=[...d.querySelectorAll('.sec')];
  let sec=secs[0];secs.forEach(s=>{if(s.getBoundingClientRect().top<=top)sec=s});if(!sec)return;
  const ch=cur.chs[+sec.dataset.ci];if(!ch)return;
  const im=[...sec.querySelectorAll('img')];
  let i=im.findIndex(x=>x.getBoundingClientRect().bottom>top);if(i<0)i=im.length-1;if(i<0)return;
  const r=im[i].getBoundingClientRect(),f=Math.max(0,Math.min(1,(top-r.top)/(r.height||1))),sr=sec.getBoundingClientRect();
  if((dr.top+d.clientHeight-sr.top)/(sr.height||1)>=.97)delete pos[ch.u];else pos[ch.u]={i,f,t:Date.now()};
  Object.keys(pos).sort((a,b)=>pos[b].t-pos[a].t).slice(300).forEach(k=>delete pos[k]);
  ls.set('pos',pos);
}
async function restorePos(ch,tok){
  const p=pos[ch.u];if(!p||(p.i<1&&p.f<.05))return;
  const d=$('#dlg'),im=[...d.querySelectorAll('.sec img')];if(!im[p.i])return;
  const need=im.slice(0,p.i+1);need.forEach(x=>x.loading='eager');
  await Promise.race([Promise.all(need.map(x=>x.complete?0:new Promise(r=>{x.addEventListener('load',r,{once:true});x.addEventListener('error',r,{once:true})}))),new Promise(r=>setTimeout(r,10000))]);
  if(rs.tok!==tok)return;
  fitImgs();
  d.scrollTop+=im[p.i].getBoundingClientRect().top+im[p.i].offsetHeight*p.f-d.getBoundingClientRect().top-60;
}
async function preload(ni){
  const ch=cur.chs?.[ni];if(!ch||pre.has(ch.u))return;pre.add(ch.u);
  try{const{urls}=await getImgs(ch);(urls||[]).slice(0,4).forEach(u=>{const m=new Image();m.referrerPolicy='no-referrer';m.src=u})}catch(e){pre.delete(ch.u)}
}
async function appendNext(){
  const c=cur;if(!c.chs||rs.busy||Date.now()-(rs.fail||0)<5000)return;
  const ni=rs.last-1,ch=c.chs[ni];if(!ch)return;
  rs.busy=true;const tok=rs.tok;
  try{
    const{urls}=await getImgs(ch);
    if(rs.tok!==tok)return;
    if(urls){$('#rd').insertAdjacentHTML('beforeend',secHtml(ni,urls,false));rs.last=ni;fitImgs()}else rs.last=-99;
  }catch(e){rs.fail=Date.now()}
  finally{if(rs.tok===tok)rs.busy=false}
}
async function openChap(i){
  const c=cur,ch=c.chs[i];if(!ch)return;
  savePos();
  const d=$('#dlg'),tok=Date.now();
  c.ci=i;rs={last:i,busy:false,tok};lt=0;
  d.classList.add('reading');saveHist(c,ch,false);persistView();
  d.innerHTML=navH(1)+`<div class="rd" id="rd" style="width:${zoom*100}%"><p class="sy" style="padding:20px">Memuat gambar…</p></div>`+navH(0);
  setNav(i);d.scrollTop=0;d.scrollLeft=0;
  try{
    const{urls}=await getImgs(ch);
    if(rs.tok!==tok)return;
    $('#rd').innerHTML=urls?secHtml(i,urls,true):'<p class="sy" style="padding:20px">Gambar tidak ditemukan pada chapter ini.</p>';
    d.scrollTop=0;
    if(urls)restorePos(ch,tok);
  }catch(e){if(rs.tok===tok)$('#rd').innerHTML=`<p class="sy" style="padding:20px">Gagal: ${esc(e.message)} <button onclick="openChap(${i})">Coba lagi</button></p>`}
}
$('#dlg').addEventListener('scroll',()=>{
  const d=$('#dlg');if(!d.classList.contains('reading')||tk)return;tk=1;
  requestAnimationFrame(()=>{tk=0;
    const t=d.scrollTop,m=d.scrollHeight-d.clientHeight,n=d.querySelector('.nv');
    if(n){if(t>lt+8&&t>80)n.classList.add('h');else if(t<lt-8)n.classList.remove('h')}
    lt=t;
    const dr=d.getBoundingClientRect(),secs=[...d.querySelectorAll('.sec')];
    let sec=secs[0];secs.forEach(s=>{if(s.getBoundingClientRect().top<=dr.top+80)sec=s});
    if(sec&&cur.chs){
      const ci=+sec.dataset.ci,r=sec.getBoundingClientRect(),p=Math.min(1,Math.max(0,(dr.top+d.clientHeight-r.top)/(r.height||1))),pi=d.querySelector('#pbi');
      if(pi)pi.style.width=(p*100)+'%';
      if(ci!==cur.ci){cur.ci=ci;setNav(ci);saveHist(cur,cur.chs[ci],false);persistView()}
      if(p>.8&&!sec.dataset.rd){sec.dataset.rd=1;saveHist(cur,cur.chs[ci],true)}
      if(p>.4)preload(ci-1);
    }
    if(m-t<1500)appendNext();
    clearTimeout(pt);pt=setTimeout(savePos,400);
  })});
$('#dlg').addEventListener('close',()=>{$('#dlg').classList.remove('reading');persistView();if(state.hist)showHist()});
$('#dlg').addEventListener('click',e=>{
  const t=e.target,b=t.closest('[data-i]'),l=t.closest('[data-l]');
  if(t.tagName==='IMG'&&t.closest('.rd')){const n=$('#dlg').querySelector('.nv');if(n)n.classList.toggle('h');return}
  if(b){const i=+b.dataset.i,d=$('#dlg'),sc=d.classList.contains('reading')&&d.querySelector(`.sec[data-ci="${i}"]`);
    if(sc){d.scrollTop+=sc.getBoundingClientRect().top-d.getBoundingClientRect().top-50;return}
    return openChap(i)}
  if(t.id==='bk'){savePos();return detail(cur)}
  if(t.id==='cs'){S.asc=!S.asc;return renderCL()}
  if(l){$('#dlg').close();setMode(l.dataset.l,false,l.textContent)}
});
$('#dlg').addEventListener('input',e=>{if(e.target.id==='cf'){S.f=e.target.value.toLowerCase().trim();renderCL()}});

function showFavs(note){state.items=favs;$('#hero').style.display='none';$('#more').hidden=true;msg((favs.length?'<button id="fchk">🔄 Cek chapter baru</button>':'Belum ada favorit.')+(note?`<div style="margin-top:8px">${esc(note)}</div>`:''));render()}

function setMode(path,paged,tab){state.favView=false;state.hist=false;state.mode=path;state.paged=paged;state.tab=tab;persistView();$('#hero').style.display='none';mark();load()}
function mark(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.textContent===state.tab));
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.textContent===state.tab));
}

$('#tabs').innerHTML=TABS.map(t=>`<button>${t[0]}</button>`).join('');
$('#chips').innerHTML=GENRES.map(g=>`<button>${g}</button>`).join('');
$('#tabs').onclick=e=>{const t=TABS.find(x=>x[0]===e.target.textContent);if(t)setMode(t[1],true,t[0])};
$('#chips').onclick=e=>{const g=e.target.textContent;if(GENRES.includes(g))setMode('page=term_result&term=genres&val='+encodeURIComponent(g),false,g)};
const doSearch=v=>{const m='page=search&search='+encodeURIComponent(v);if(state.mode===m&&!state.hist&&!state.favView)return;setMode(m,false,'Cari')};
let qt;
$('#q').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){clearTimeout(qt);doSearch(e.target.value.trim())}};
$('#q').oninput=e=>{clearTimeout(qt);const v=e.target.value.trim();qt=setTimeout(()=>{if(v.length>=2)doSearch(v);else if(!v&&state.tab==='Cari')setMode(TABS[0][1],true,'Terbaru')},500)};
$('#more').onclick=()=>{if(!loading){state.page++;load(false)}};
new IntersectionObserver(es=>{if(es[0].isIntersecting&&!loading&&!$('#more').hidden){state.page++;load(false)}},{rootMargin:'700px'}).observe($('#more'));
$('#grid').onclick=e=>{
  const hd=e.target.closest('[data-hd]');if(hd){e.stopPropagation();delete hist[hd.dataset.hd];ls.set('hist',hist);return showHist()}
  const hc=e.target.closest('[data-h]');if(hc){const en=hist[hc.dataset.h];if(en)detail(en.c);return}
  const f=e.target.closest('[data-f]');
  if(f){e.stopPropagation();const c=state.items[f.dataset.f],i=favs.findIndex(x=>x.id===c.id);
    i>=0?favs.splice(i,1):(c.seen=c.latest=c.sub,favs.push(c));saveFavs();state.favView?showFavs():render();return}
  const c=e.target.closest('.c');if(c)detail(state.items[c.dataset.i]);
};
$('#fav').onclick=()=>{state.hist=false;state.favView=!state.favView;state.favView?showFavs():load()};
$('#hs').onclick=()=>{if(state.hist){state.hist=false;load()}else showHist()};
$('#msg').onclick=e=>{if(e.target.id==='fchk')return checkUpdates();if(e.target.id==='hclr'&&confirm('Hapus semua riwayat baca?')){hist={};ls.set('hist',hist);showHist()}};
$('#th').onclick=()=>{document.documentElement.classList.toggle('light');ls.set('light',document.documentElement.classList.contains('light'))};
$('#cfg').onclick=()=>{$('#base').value=BASE;$('#proxy').value=PROXY;$('#set').showModal()};
$('#save').onclick=()=>{BASE=$('#base').value.trim();PROXY=$('#proxy').value.trim();ls.set('base',BASE);ls.set('proxy',PROXY);$('#set').close();load()};
if(ls.get('light',false))document.documentElement.classList.add('light');
[$('#dlg'),$('#set')].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){savePos();persistView()}});
addEventListener('pagehide',()=>{savePos();persistView()});
(async()=>{
  const v=ls.get('view',null);
  if(v&&v.m){state.mode=v.m;state.paged=v.p;state.tab=v.t||'Terbaru';state.favView=!!v.f;state.hist=!!v.h}
  mark();
  if(state.hist)showHist();else await load();
  if(v&&v.o&&v.c){
    await detail(v.c);
    if(v.o==='read'&&v.ci!=null&&cur.chs&&cur.chs[v.ci])openChap(v.ci);
  }
})();
</script>
</body>
